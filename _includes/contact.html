<!-- Contact Section -->
<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Get In Touch</h2>
                <h3 class="section-subheading" style="color:rgba(255,255,255,0.7);">Whether you want to volunteer, partner, or learn more about our work &mdash; we'd love to hear from you.</h3>
            </div>
        </div>
        <div style="display:flex; justify-content:center; width:100%;">
        <givebutter-widget id="jNKxnk"></givebutter-widget>
        </div>
        <div class="row">
            <div class="col-lg-12 text-center" style="margin-bottom:40px;">
                <p style="color:#fff; font-size:1.05em;">
                    <i class="fa fa-envelope" style="margin-right:8px;"></i>
                    <a href="mailto:info@roots2harvestfoundation.org" style="color:#fff;">info@roots2harvestfoundation.org</a>
                </p>
                <p style="color:rgba(255,255,255,0.8); font-size:0.95em;">
                    1450 Forestdale Blvd, Unit 310036 &bull; Birmingham, AL 35214<br>
                    Proudly serving Birmingham, Alabama and the Southeast
                </p>
            </div>
        </div>
       
        <div class="row">
            <div class="col-lg-12">
                <form name="sentMessage" id="contactForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <input type="text" class="form-control" placeholder="Your Name *" id="name" required data-validation-required-message="Please enter your name.">
                                <p class="help-block text-danger"></p>
                            </div>
                            <div class="control-group form-group">
                                <input type="email" class="form-control" placeholder="Your Email *" id="email" required data-validation-required-message="Please enter your email address.">
                                <p class="help-block text-danger"></p>
                            </div>
                            <div class="control-group form-group">
                                <input type="tel" class="form-control" placeholder="Your Phone" id="phone">
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <textarea class="form-control" placeholder="Your Message *" id="message" required data-validation-required-message="Please enter a message."></textarea>
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center">
                            <div id="success"></div>
                            <button type="submit" class="btn btn-xl">Send Message</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
